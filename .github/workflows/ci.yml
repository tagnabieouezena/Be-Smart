name: CI

# Phase 0 — Fondations : cette CI tourne entièrement contre une stack Supabase
# locale et éphémère lancée dans le runner (Docker gratuit inclus dans GitHub
# Actions). Elle ne touche jamais le compte Supabase de production.
#
# Prochaine étape (pas encore ici, prématurée tant qu'il n'y a rien à
# déployer) : un job séparé, déclenché uniquement sur push vers `main`, qui
# exécutera `supabase db push` via `SUPABASE_ACCESS_TOKEN` (secret GitHub) pour
# promouvoir les migrations validées vers la prod. Voir docs/01-stack-et-architecture.md §3.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Installé en tout premier (avant tout ce qui peut échouer) : le step
      # "Stop Supabase local" plus bas tourne avec `if: always()`, y compris
      # si un step précédent échoue, et a donc besoin du CLI dans tous les cas.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Start Supabase local (migrations + seed)
        run: supabase start

      - name: Test d'isolation multi-tenant (adversarial)
        run: |
          psql "$(supabase status -o env | grep DB_URL | cut -d '=' -f2- | tr -d '\"')" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/isolation_multi_tenant.sql

      - name: Test bootstrap entreprise+CEO (adversarial, Module 4.1)
        run: |
          psql "$(supabase status -o env | grep DB_URL | cut -d '=' -f2- | tr -d '\"')" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/bootstrap_entreprise_ceo.sql

      - name: Test paramétrage — catégories et objectifs de CA (adversarial, Module 4.2)
        run: |
          psql "$(supabase status -o env | grep DB_URL | cut -d '=' -f2- | tr -d '\"')" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/parametrage_categories_objectifs.sql

      - name: Test budget prévisionnel (adversarial, Module 4.3)
        run: |
          psql "$(supabase status -o env | grep DB_URL | cut -d '=' -f2- | tr -d '\"')" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/budget_previsionnel.sql

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$(supabase status -o env | grep '^ANON_KEY' | cut -d '=' -f2- | tr -d '\"')"
          npm run build

      - name: Test invitation comptable (adversarial, Module 4.1 — un comptable doit être rejeté 403)
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$(supabase status -o env | grep '^ANON_KEY' | cut -d '=' -f2- | tr -d '\"')"
          export SUPABASE_SERVICE_ROLE_KEY="$(supabase status -o env | grep '^SERVICE_ROLE_KEY' | cut -d '=' -f2- | tr -d '\"')"

          npx next start -p 3010 &
          NEXT_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3010 >/dev/null && break
            sleep 1
          done

          COMPTABLE_TOKEN=$(curl -s -X POST "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"email":"comptable-a@test.besmart.local","password":"mot-de-passe-test"}' \
            | jq -r '.access_token')

          STATUS=$(curl -s -o /tmp/reponse.json -w "%{http_code}" -X POST http://localhost:3010/api/comptable/inviter \
            -H "Authorization: Bearer $COMPTABLE_TOKEN" -H "Content-Type: application/json" \
            -d '{"email":"intrus@test.besmart.local","nom":"Intrus"}')

          cat /tmp/reponse.json
          kill "$NEXT_PID"

          if [ "$STATUS" != "403" ]; then
            echo "ECHEC : attendu HTTP 403 pour un comptable appelant /api/comptable/inviter, reçu $STATUS"
            exit 1
          fi
          echo "OK — un comptable est bien rejeté (403) par la route d'invitation"

      - name: Stop Supabase local
        if: always()
        run: supabase stop
